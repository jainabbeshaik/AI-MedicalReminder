<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Medical Reminder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#2196F3,#64B5F6);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:90%;
    max-width:400px;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.logo{
    font-size:70px;
}

h1{
    color:#1565C0;
    margin-top:10px;
}

h3{
    color:#444;
    margin:10px 0;
}

p{
    color:#666;
    margin-bottom:25px;
}

.btn{
    display:block;
    text-decoration:none;
    background:#1565C0;
    color:white;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#0D47A1;
}

.footer{
    margin-top:20px;
    color:gray;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">💊🤖</div>

<h1>AI Medical Reminder</h1>

<h3>Your Smart Health Assistant</h3>

<p>
Never miss your medicines again.
Get intelligent reminders and manage your medications easily.
</p>

<a href="/login" class="btn">🔐 Login</a>

<a href="/register" class="btn">📝 Register</a>

<div class="footer">
Made with ❤️ using AI
</div>

</div>

</body>
</html>
