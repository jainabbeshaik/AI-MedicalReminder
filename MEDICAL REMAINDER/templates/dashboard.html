<!DOCTYPE html>
<html>
<head>
    <title>AI Medical Reminder Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#eef5ff;
        }

        .header{
            background:#1565C0;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:80%;
            margin:30px auto;
        }

        .welcome{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 3px 10px gray;
            margin-bottom:30px;
        }

        .menu{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .card{
            background:white;
            border-radius:15px;
            box-shadow:0px 3px 10px gray;
            text-align:center;
            padding:30px;
            transition:.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card a{
            text-decoration:none;
        }

        .card button{
            width:100%;
            padding:15px;
            font-size:20px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:#1976D2;
            color:white;
        }

        .logout button{
            background:#d32f2f;
        }

        footer{
            text-align:center;
            margin-top:40px;
            color:#555;
        }

    </style>

</head>

<body>

<div class="header">
    <h1>💊 AI Medical Reminder Dashboard</h1>
</div>

<div class="container">

<div class="welcome">

<h2>Welcome 👋</h2>

<p>Manage your medicines and reminders easily.</p>

</div>

<div class="menu">

<div class="card">
<a href="/add_medicine">
<button>💊 Add Medicine</button>
</a>
</div>

<div class="card">
<a href="/view_medicines">
<button>📋 View Medicines</button>
</a>
</div>

<div class="card">
<a href="/reminder_settings">
<button>⏰ Reminder Settings</button>
</a>
</div>
<div class="card">
    <a href="/ai_assistant">
        <button>🤖 AI Assistant</button>
    </a>
</div>

<div class="card logout">
<a href="/logout">
<button>🚪 Logout</button>
</a>
</div>

</div>

<footer>

<h3>AI Based Medical Reminder System</h3>

<p>Python | Flask | SQLite | Telegram Bot</p>

</footer>

</div>

</body>
</html>
