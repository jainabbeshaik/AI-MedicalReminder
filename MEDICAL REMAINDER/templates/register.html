<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="header">
    <h1>💊 AI Medical Reminder</h1>
</div>

<div class="container">

    <div class="card">

        <h2>👤 Create Account</h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <center>
            Already have an account?
            <a href="/login">Login Here</a>
        </center>

    </div>

    <div class="footer">
        AI Medical Reminder System
    </div>

</div>


</body>
</html>
